name: Build and test

# One workflow for a pull request:
#   1. Check Build Artifacts: 'npm run build' leaves nothing to commit
#   2. the end-to-end tests of what the pull request changed, once the build is right: for
#      a script of public/scripts, its own test and all-scripts, which checks what every
#      script must do. tests_e2e/run.sh decides (--changed), so that the same choice can
#      be made on a developer's machine.
# On main, the build is checked again, the site is signed and deployed, and the
# documentation is published.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      tests:
        description: 'Tests to run, separated by spaces (empty: every test)'
        required: false
        default: ''

concurrency:
  group: build-and-test-${{ github.ref }}
  # A new push to a pull request replaces its run; a run on main is left to finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-build-artifacts:
    name: Check Build Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Error: Build created uncommitted changes!"
            echo ""
            echo "The following files were modified by the build:"
            git status --porcelain
            echo ""
            echo "Please run 'npm run build' locally and commit the generated files."
            exit 1
          else
            echo "✅ Success: No uncommitted changes after build"
          fi

  select:
    name: Select the tests
    needs: check-build-artifacts
    # The tests of a change ran on its pull request: not again when it reaches main
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.select.outputs.tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The whole history: the tests are chosen from what changed since the base
          fetch-depth: 0

      - name: Select the tests of what changed
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TESTS: ${{ github.event.inputs.tests }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            names="$(tests_e2e/run.sh --changed "${BASE}...${HEAD}" --list)"
          elif [[ -n "$TESTS" ]]; then
            names="$(tests_e2e/run.sh --list $TESTS)"
          else
            names="$(tests_e2e/run.sh --list)"
          fi
          tests="$(jq -R . <<<"$names" | jq -sc 'map(select(length > 0))')"
          echo "Tests: ${tests}"
          echo "tests=${tests}" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.test }}
    needs: select
    if: needs.select.outputs.tests != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.select.outputs.tests) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run the test on every image it applies to
        env:
          # For the scripts that ask the GitHub API, which allows 60 requests an hour to
          # an address that does not identify itself, and a runner shares its address
          GITHUB_TOKEN: ${{ github.token }}
          TEST: ${{ matrix.test }}
        run: tests_e2e/run.sh "$TEST"

  # One check to require in the branch protection, whatever tests were selected
  result:
    name: End-to-end tests
    needs: [check-build-artifacts, select, test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the result of the build and of the tests
        env:
          BUILD: ${{ needs.check-build-artifacts.result }}
          SELECT: ${{ needs.select.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "build: ${BUILD}, select: ${SELECT}, tests: ${TEST}"
          [[ "$BUILD" == "success" ]]
          [[ "$SELECT" == "success" || "$SELECT" == "skipped" ]]
          [[ "$TEST" == "success" || "$TEST" == "skipped" ]]

  # The site is deployed from here, and not by Cloudflare from git: the signatures that
  # load.sh checks are made with a secret of this repository, in dist/, and never
  # committed. Only main gets here: a pull request is not deployed.
  deploy:
    name: Deploy
    needs: check-build-artifacts
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Sign what the loader downloads
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: scripts/sign-dist.sh dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=loader-launch --branch=main

  Documentation:
    if: github.ref == 'refs/heads/main'
    needs: check-build-artifacts
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: devops
      project: ${{ github.event.repository.name }}
    secrets: inherit
